<style>
  @media screen and (min-width: 64em) {
    .main-content { max-width: 70%; }
  }
  .tabs-nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem;
    padding: 0 1rem;
    background: #fff;
    border-bottom: 1px solid #dce6f0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
  }
  .tabs-nav button {
    padding: 0.9rem 1.1rem 0.75rem;
    border: 0;
    border-bottom: 3px solid transparent;
    background: none;
    color: #606c71;
    font: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .tabs-nav button:hover { color: #159957; }
  .tabs-nav button[aria-selected="true"] {
    color: #159957;
    font-weight: 600;
    border-bottom-color: #159957;
  }
  .tab-panel[hidden] { display: none; }
  .tab-panel > h1:first-child,
  .tab-panel > h2:first-child { margin-top: 0; }
</style>
<script>
  // Shows the page content as tabs placed right below the header.
  // Sections ("##") listed in GROUPS share a tab or get a shorter label; other sections get their own tab.
  // Content before the first "##" gets the tab named in INTRO for that page (by its "#" title),
  // or joins the first section's tab when INTRO maps the page to null. Default: "Inicio".
  document.addEventListener("DOMContentLoaded", function () {
    var GROUPS = {
      "presentacion": "Inicio",
      "objetivos": "Inicio",
      "organizacion de los encuentros": "Encuentros",
      "desarrollo de las actividades": "Encuentros",
      "requisitos tecnicos y preparacion previa": "Requisitos y cuadernos",
      "notebooks y recursos practicos": "Requisitos y cuadernos",
      "modalidad de trabajo y evaluacion formativa": "Trabajo y evaluación",
      "orientaciones para el trabajo con fuentes y modelos": "Trabajo y evaluación",
      "resultado esperado": "Trabajo y evaluación",
      "bibliografia por modulos": "Bibliografía",
      "a. layout, materialidad y segmentacion": "A. Layout",
      "b. ocr, errores y critica de fuentes digitalizadas": "B. OCR",
      "c. entropia lite, desarrollo y critica de herramientas": "C. Herramientas",
      "d. rag, agentes y consulta asistida": "D. RAG y agentes",
      "como usarlos en colab": "Uso en Colab",
      "elegir las imagenes": "Imágenes",
      "imagenes": "Imágenes",
      "que produce cada cuaderno": "Resultados",
      "ejecutar fuera de colab": "Fuera de Colab",
      "1. funcionamiento": "Funcionamiento",
      "2. pagina comun (centro gallego, montevideo, 1917)": "Página común",
      "3. manuscritos": "Manuscritos",
      "4. paddleocr-vl (03)": "PaddleOCR-VL",
      "5. preguntas que estos resultados permiten discutir": "Preguntas"
    };
    var INTRO = {
      "cuadernos del taller: layout y ocr": "Cuadernos",
      "bibliografia del taller": "Presentación",
      "evaluacion de los cuadernos": null
    };
    var normalize = function (text) {
      return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
    };

    var main = document.querySelector("main.main-content");
    if (!main) return;
    var footer = main.querySelector("footer.site-footer");
    var nodes = Array.prototype.filter.call(main.children, function (el) { return el !== footer; });
    if (nodes.filter(function (el) { return el.tagName === "H2"; }).length < 3) return;

    var title = main.querySelector("h1");
    var introKey = title ? normalize(title.textContent) : "";
    var introLabel = introKey in INTRO ? INTRO[introKey] : "Inicio";

    var tabs = [];
    var byLabel = {};
    var current = null;
    var pending = [];
    nodes.forEach(function (node) {
      var label = null;
      if (node.tagName === "H2") label = GROUPS[normalize(node.textContent)] || node.textContent.trim();
      else if (!current && introLabel) label = introLabel;
      else if (!current) { pending.push(node); return; }
      if (label) {
        if (!byLabel[label]) {
          var panel = document.createElement("section");
          panel.className = "tab-panel";
          panel.setAttribute("role", "tabpanel");
          byLabel[label] = { label: label, panel: panel };
          tabs.push(byLabel[label]);
        }
        current = byLabel[label];
        pending.forEach(function (n) { current.panel.appendChild(n); });
        pending = [];
      }
      current.panel.appendChild(node);
    });

    var nav = document.createElement("nav");
    nav.className = "tabs-nav";
    nav.setAttribute("role", "tablist");
    var header = document.querySelector("header.page-header");
    header.parentNode.insertBefore(nav, header.nextSibling);
    tabs.forEach(function (tab, i) {
      main.insertBefore(tab.panel, footer);
      tab.button = document.createElement("button");
      tab.button.type = "button";
      tab.button.setAttribute("role", "tab");
      tab.button.textContent = tab.label;
      tab.button.addEventListener("click", function () {
        show(i);
        var heading = tab.panel.querySelector("h1, h2");
        history.replaceState(null, "", heading && heading.id ? "#" + heading.id : location.pathname);
        if (nav.getBoundingClientRect().top <= 0) nav.scrollIntoView();
      });
      nav.appendChild(tab.button);
    });

    function show(index) {
      tabs.forEach(function (tab, i) {
        tab.panel.hidden = i !== index;
        tab.button.setAttribute("aria-selected", String(i === index));
      });
    }

    function showTarget(hash) {
      if (!hash || hash.length < 2) return false;
      var target = document.getElementById(decodeURIComponent(hash.slice(1)));
      if (!target) return false;
      for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].panel.contains(target)) {
          show(i);
          target.scrollIntoView();
          return true;
        }
      }
      return false;
    }

    document.addEventListener("click", function (event) {
      var link = event.target.closest && event.target.closest("a[href^='#']");
      if (link && showTarget(link.getAttribute("href"))) event.preventDefault();
    });

    if (!showTarget(location.hash)) show(0);
  });
</script>
